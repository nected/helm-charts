{{/*
The scripts, mounted into the job at /opt/secretsmanager. They contain no
credential material, so this is safe to read with kubectl.

Shipping the code in a ConfigMap rather than an image means a fix to run.sh is
a chart release, with no image rebuild.

Weight -10 puts this before the Job at -5, so the mount is always populated.
*/}}
{{- $files := dict
  "run.sh"   (.Files.Get "files/run.sh")
  "lib.sh"   (.Files.Get "files/lib.sh")
  "http.sh"  (.Files.Get "files/http.sh")
  "json.awk" (.Files.Get "files/json.awk")
  "aws.sh"   (.Files.Get "files/aws.sh")
  "azure.sh" (.Files.Get "files/azure.sh")
}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "secretsmanager.fullname" . }}-scripts
  labels:
    {{- include "secretsmanager.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- range $name, $content := $files }}
  {{ $name }}: |
{{ $content | indent 4 }}
  {{- end }}
