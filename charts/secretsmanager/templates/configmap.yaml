{{- if include "secretsmanager.active" . }}
{{/*
The scripts, mounted into the job at /opt/secretsmanager. They hold no
credential material, so this is safe to read with kubectl.

Shipping the code in a ConfigMap rather than an image means a fix to run.sh is
a chart release, with no image rebuild.

.Files.Glob rather than a hand-listed dict: .Files.Get returns an empty string
for a missing file instead of failing, so a list that drifted out of step with
files/ silently shipped empty keys.

Weight -10 puts this before the Job at -5, so the mount is always populated.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "secretsmanager.fullname" . }}-scripts
  labels:
    {{- include "secretsmanager.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- range $path, $_ := .Files.Glob "files/*" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
{{- end }}
