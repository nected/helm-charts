{{/*
Runs before everything else in this release, and this release installs before
temporal and nected. Still a hook rather than a plain Job even as its own
release: Job specs are immutable, so a plain Job would not re-run on upgrade.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "secretsmanager.fullname" . }}
  labels:
    {{- include "secretsmanager.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: {{ .Values.backoffLimit }}
  template:
    metadata:
      name: {{ include "secretsmanager.fullname" . }}
      labels:
        {{- include "secretsmanager.podLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "secretsmanager.podSpec" . | nindent 6 }}
