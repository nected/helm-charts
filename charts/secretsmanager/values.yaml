# secretsmanager
#
# The one job that materialises Nected's Kubernetes Secrets. Shipped as an
# optional subchart of both the nected and temporal charts, and installable on
# its own.
#
# Two independent pieces of work:
#
#   commonSecret   ensure the encryption-at-rest key exists
#   credentials    read the application credentials into a Secret
#
# Defaults are deliberately neutral: remoteKeys and requiredKeys are empty,
# because a vault path or a required-key set baked in here would follow every
# customer into their own account.
#
# `provider` selects the vault; it does not switch the job on. With no provider
# the encryption-at-rest key is still generated locally, which is what the
# nected chart's own job used to do.
#
# The same holds when a provider IS set but cannot be reached or the identity
# has no access: the job warns, handles the encryption-at-rest key locally, and
# only fails if credentials.enabled is true, since those genuinely need a
# vault. Having no Secrets Manager or Key Vault access never blocks an install
# that is only managing the key.
#
# Nothing renders unless commonSecret.enabled or credentials.enabled is true,
# so there is no separate on/off flag to forget.

nameOverride: ""
fullnameOverride: ""

# "" = no vault, local only | aws | azure
provider: ""

# Vault unreachable during an upgrade:
#   true  -> warn and continue when the credentials Secret already exists
#            (a first install has nothing to fall back on and still fails)
#   false -> always fail the release
#
# It also decides what happens when commonSecret.remoteKey cannot be READ -
# denied rather than absent - so it is unknown whether a key is stored there:
#   true  -> generate a new key, with a loud warning
#   false -> refuse, because a new key cannot decrypt data written under the old
#            one. Use false if you restore clusters from backups.
failOpen: true

aws:
  region: ""
  # Only for a VPC interface endpoint or a non-standard partition.
  endpoint: ""

azure:
  # https://<vault>.vault.azure.net
  vaultUrl: ""

# ---------------------------------------------------------------------------
# commonSecret - the encryption-at-rest key
#
# This is the RSA key Nected encrypts stored data with. It is not the shared
# application Secret: that one is credentials.secret below.
#
# Precedence when the Kubernetes Secret does not yet exist:
#   1. secretValue  - an operator's deliberate restore
#   2. remoteKey    - a copy you previously stored in the vault
#   3. generate     - first install
#
# An existing Kubernetes Secret is never touched, so a key that is already
# decrypting data cannot be replaced by accident.
#
# KEEP A COPY. This job never writes to the vault, so a generated key lives
# only in the Kubernetes Secret:
#
#   kubectl -n <ns> get secret encryption-at-rest-secret \
#     -o jsonpath='{.data.encryption-at-rest}'
#
# Lose that and everything encrypted under it is unreadable.
# ---------------------------------------------------------------------------
commonSecret:
  # nected needs this; temporal does not.
  enabled: true

  # Base64 of the PEM, exactly as the Kubernetes Secret stores it - so a
  # restore is a copy of `kubectl get secret ... -o jsonpath=...`.
  # Takes precedence over the vault.
  secretValue: ""

  # Vault item to RESTORE from. Requires a provider.
  #   aws:   nected/prod/encryption-at-rest
  #   azure: nected-prod-encryption-at-rest
  #
  # This job only reads it. Nothing here puts the key into the vault, so the
  # item is whatever you or your pipeline stored under this name; leave it
  # empty and a first install generates a key instead.
  remoteKey: ""

  secretName: encryption-at-rest-secret
  secretKey: encryption-at-rest

# ---------------------------------------------------------------------------
# credentials - the shared application Secret
# ---------------------------------------------------------------------------
credentials:
  # Requires a provider.
  enabled: false

  # The Secret this job writes. Point the app charts' existingSecret at it.
  secret: nected-credential

  # One or more remote items, each holding a flat JSON object of
  # ENV_VAR -> value. Several are merged in order, later entries winning.
  #
  # One item is usually right. Splitting only pays off once different items
  # need different write policies - for example denying PutSecretValue on an
  # item holding AES_SECRET while still rotating passwords in another. Without
  # that policy a second item is a naming convention, not protection.
  #
  # AWS: secret ids, slashes fine     -> nected/prod/app
  # Azure: Key Vault names, [a-zA-Z0-9-] only -> nected-prod-app
  # (the env var names live inside the JSON either way)
  #
  # No default: this has to be your own vault path.
  remoteKeys: []

  # Copy one stored value to a second key, as TARGET: SOURCE.
  #
  # Defaulted because it is a property of Nected's services rather than of any
  # one environment: nalanda reads MASTER_DB_PASSWORD while the vidhaan
  # services and medha read DB_PASSWORD, and both are the same Postgres
  # password. Storing it once and aliasing means a rotation updates the vault
  # in one place. Set to {} if you store both keys explicitly.
  aliases:
    # nalanda reads MASTER_DB_PASSWORD, the vidhaan services and medha read
    # DB_PASSWORD; same Postgres password. Safe as a default because Postgres
    # is mandatory, so DB_PASSWORD is always in the payload.
    MASTER_DB_PASSWORD: DB_PASSWORD
    VIDHAAN_REDIS_PASSWORD: REDIS_PASSWORD
    # NOT defaulted, though nalanda reads VIDHAAN_REDIS_PASSWORD while
    # everything else reads REDIS_PASSWORD:
    #
    #   VIDHAAN_REDIS_PASSWORD: REDIS_PASSWORD
    #
    # A missing alias SOURCE aborts the sync, and Redis is optional, so a vault
    # with no REDIS_PASSWORD would fail every first install. Add it yourself if
    # you list VIDHAAN_REDIS_PASSWORD in the app charts' secretKeys - otherwise
    # that key is stripped from the ConfigMap and supplied by nothing.

  # Checked against the MERGED payload before anything is written, so a key
  # may come from any item or an alias. A missing key aborts the sync and
  # leaves the running system untouched.
  #
  # No default: this fails closed, so an opinionated list here would block
  # anyone whose vault holds a different set. See
  # values/secrets-values.yaml for the full set Nected's services read.
  requiredKeys: []

  # Deployments rolled when the payload changes. Values taken from envFrom or
  # secretKeyRef are fixed when a container starts, so a rotated Secret is
  # invisible to running pods without this.
  #
  # Empty uses the defaults below. These MUST match your release names: get
  # them wrong and the sync succeeds while pods keep stale credentials.
  restartTargets: []
  nectedReleaseName: nected
  temporalFullname: nected-temporal

# ---------------------------------------------------------------------------
serviceAccount:
  create: true

  # The identity binding target. With EKS Pod Identity the IAM role is mapped
  # to (namespace, this name) server-side, so the name is a prerequisite you
  # publish rather than something the role is configured against here.
  name: nected-secret-sync

  # --- how the job gets vault credentials: set at most one ---
  #
  # EKS IRSA (OIDC). The role trust policy must allow
  # sts:AssumeRoleWithWebIdentity from the cluster OIDC provider with
  # sub = system:serviceaccount:<ns>:<name above>, aud = sts.amazonaws.com
  roleArn: ""

  # Azure Workload Identity. Required when provider is azure: the webhook
  # injects nothing without it. The pod label is added by this chart.
  clientId: ""

  # EKS Pod Identity: leave both empty. The role is attached with the AWS API
  # against (namespace, name above), not by annotation.

  # Anything else for the ServiceAccount. roleArn and clientId render into
  # this; set them above rather than here.
  annotations: {}

rbac:
  create: true

image:
  # Must provide curl, jq, kubectl and openssl. Built from
  # devops/openssl-docker; the job checks at startup and fails clearly if not.
  #
  # This default ships in the published chart, so it has to be a registry your
  # customers can pull from. Override it for a private mirror.
  repository: public.ecr.aws/f6k1n6r3/openssl-kubectl-v1

  # `latest` plus IfNotPresent means a node that already cached the tag never
  # re-pulls, so the job silently runs whatever that node fetched last. Always
  # avoids that; the job runs once per helm upgrade, so the pull is cheap.
  # Pin a version tag here instead once one is published, then use
  # IfNotPresent.
  tag: latest
  pullPolicy: Always

backoffLimit: 2
resources: {}
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
