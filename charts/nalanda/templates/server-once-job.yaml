{{- if .Values.autoSetup.enabled }}
{{/*
Hook-owned copy of the app ConfigMap so the setup job can run as a
pre-install/pre-upgrade hook. The regular ConfigMap does not exist yet
(fresh install) or is stale (upgrade) when pre hooks run. Weight -1 keeps it
before the setup job (0); the common-secret job in the parent chart is also
at -1 and the secret it creates is only needed by the job itself.
Only before-hook-creation is used: hook-succeeded would delete the ConfigMap
right after creation, before the job pod is scheduled.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}-setup
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- include "common.configMapData" . | nindent 2 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.fullname" . }}-setup
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.autoSetup.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: {{ .Values.autoSetup.backoffLimit }}
  template:
    metadata:
      name: {{ include "common.fullname" . }}-setup
      labels:
        {{- include "common.labels" . | nindent 8 }}
    spec:
        containers:
          - name: setup
            image: {{ .Values.autoSetup.image.repository }}:{{ .Values.autoSetup.image.tag }}
            imagePullPolicy: {{ .Values.autoSetup.image.pullPolicy }}
            {{- with .Values.autoSetup.command }}
            command:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.autoSetup.args }}
            args:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.existingSecretMap }}
            env:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- if or (not .Values.mountConfigMap) .Values.existingSecret }}
            envFrom:
            {{- if not .Values.mountConfigMap }}
            - configMapRef:
                name: {{ include "common.fullname" . }}-setup
            {{- end }}
            {{- with .Values.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- end }}
            {{- with .Values.autoSetup.resources }}
            resources:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            volumeMounts:
              {{- if .Values.mountConfigMap }}
              - mountPath: /mnt/temp
                name: {{ include "common.name" . }}-cm-volume
              {{- end }}
              {{- if .Values.volumeMounts }}
              {{- toYaml .Values.volumeMounts | nindent 14 }}
              {{- end }}
        volumes:
          {{- if .Values.mountConfigMap }}
          - name: {{ include "common.name" . }}-cm-volume
            configMap:
              name: {{ include "common.fullname" . }}-setup
              items:
                - path: envFile
                  key: envFile
          {{- end }}
          {{- if .Values.volumes }}
          {{- toYaml .Values.volumes| nindent 10 }}
          {{- end }}
        {{- with .Values.nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        restartPolicy: OnFailure
{{- end}}