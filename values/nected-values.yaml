# default username / password to be used post deployment for login
NECTED_UI_USER_NAME: &uiUserName dev@nected.ai
NECTED_UI_USER_PASSWORD: &uiUserPassword devPass123

# configurations for Postgres / Redis / ElasticSearch
# default values is set according to datastore chart
NECTED_PG_HOST: &pgHost datastore-postgresql
NECTED_PG_DATABASE: &pgDatabase nected
NECTED_PG_USER: &pgUser nected
NECTED_PG_PASSWORD: &pgPassword psqlPass123
NECTED_PG_PORT: &pgPort "5432"
NECTED_PG_SSL_MODE: &pgSslMode disable # require or disable

NECTED_REDIS_TLS_ENABLED: &redisTlsEnabled "false"
NECTED_REDIS_INSECURE_TLS: &redisInsecureTls "true"
NECTED_REDIS_HOST_PORT: &redisHostPort datastore-redis-master:6379
NECTED_REDIS_HOST: &redisHost datastore-redis-master
NECTED_REDIS_PORT: &redisPort "6379"
NECTED_REDIS_USERNAME: &redisUser ""
NECTED_REDIS_PASSWORD: &redisPassword ""

# false if audit log not required, no elasticSearch
NECTED_ELASTIC_ENABLED: &elasticEnabled "true"
 # opensearch: OpenSearch, managed: ElasticSearch
NECTED_ELASTIC_PROVIDER: &elasticProvider managed
NECTED_ELASTIC_HOSTS: &elasticHost http://elasticsearch-master:9200
NECTED_ELASTIC_INSECURE_TLS: &elasticInsecureTls "true"
NECTED_ELASTIC_API_KEY: &elasticAPiKey ""
NECTED_ELASTIC_USER: &elasticUser elastic
NECTED_ELASTIC_PASSWORD: &elasticPassword esPass123

# Observability
OTEL_ENABLED: &otlpEnabled "false"
OTEL_EXPORTER_OTLP_PROTOCOL: &otlpProtocol "grpc"
OTEL_EXPORTER_OTLP_ENDPOINT_TRACE: &otlpEndpointTrace ""
OTEL_EXPORTER_OTLP_ENDPOINT_METRIC: &otlpEndpointMetric ""
OTEL_EXPORTER_OTLP_HEADERS: &otlpHeaders ""
OTEL_TRACES_SAMPLER_RATIO: &otlpSamplerRatio "1.0"
OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: &otlpTemporality "cumulative" # delta / cumulative

# Secret holding every credential. Set this and the matching keys below are
# supplied from it instead of from envVars.
#
# IMPORTANT: envVars render into a ConfigMap. Setting existingSecret only makes
# the Secret win at container start - it does NOT remove the plaintext from the
# ConfigMap. Comment out or delete the password/secret entries in the envVars
# blocks below as well.
# Default is "" = credentials come from the inline values in this file, as
# before. To use a Secret instead (the one secretsmanager writes below, or one
# you create yourself):
#   1. existingSecret: nected-credential
#   2. list the keys it supplies in secretKeys, so they leave the ConfigMap
#   3. blank the matching passwords at the top of this file
existingSecret: &credentialSecret ""

# Keys supplied by existingSecret, kept out of the ConfigMap. Shared by every
# service below; a key a service does not use is ignored. Leave [] while
# existingSecret is empty - the render fails if secretKeys is set without it.
# Every key listed must exist in the Secret.
secretKeys: &credentialSecretKeys []
#  - AES_SECRET                  # nalanda
#  - JWT_SECRET                  # nalanda
#  - DEFAULT_VIDHAAN_SECRET_KEY  # nalanda
#  - VIDHAAN_PRE_SHARED_KEY      # nalanda, vidhaan-*  (licence key)
#  - MASTER_DB_PASSWORD          # nalanda
#  - DB_PASSWORD                 # vidhaan-*, medha
#  - REDIS_PASSWORD              # nalanda, vidhaan-*, garuda
#  - VIDHAAN_REDIS_PASSWORD      # nalanda (not aliased by default; store it in the vault)
#  - ELASTIC_PASSWORD            # nalanda, vidhaan-*
#  - ELASTIC_API_KEY             # nalanda, vidhaan-*
#  - NECTED_USER_PASSWORD        # nalanda
#  - EMAIL_PASSWORD              # nalanda
#  - AWS_SECRET_KEY              # nalanda
#  - MICROSOFT_CLIENT_SECRET     # nalanda
#  - PRODUCT_API_KEY             # nalanda
#  - TEMPORAL_EXECUTER_API_KEY   # vidhaan-*
#  - COPILOT_API_KEY             # medha

# secretsmanager subchart: one job that runs as a pre-install/pre-upgrade hook
# (weights -10/-5) ahead of the rest of THIS release, including nalanda's DB
# setup job. Hooks only order within a release, so it is not guaranteed to run
# before the temporal release; whichever release installs first writes the
# Secret and the other sees an unchanged hash and does nothing.
#
# `provider` selects a vault, it does not switch the job on. With no provider
# the encryption-at-rest key is still generated locally, as before.
#
# Requires a workload identity bound to service account `nected-secret-sync`
# in this namespace (serviceAccount.roleArn / clientId below). No credentials
# are configured here.
secretsmanager:
  provider: ""                     # "" = local only | aws | azure

  # The encryption-at-rest key. Never replaced once the Secret exists.
  commonSecret:
    enabled: true
    secretValue: ""                # base64 of the PEM; takes precedence over the vault
    # Restore source only: the job reads this item and never writes it, so a
    # generated key's only copy is the Kubernetes Secret. Save it yourself.
    remoteKey: ""                  # aws: nected/prod/encryption-at-rest | azure: nected-prod-encryption-at-rest

  # Application credentials -> the Secret named in existingSecret above.
  credentials:
    enabled: false                 # requires a provider
    secret: nected-credential      # must equal existingSecret above
    # Remote items holding a flat JSON of ENV_VAR -> value; merged in order,
    # later wins. aws: nected/prod/app | azure: nected-prod-app
    remoteKeys: []
    # Verified before anything is written; a missing key aborts the sync and
    # leaves the running system untouched.
    requiredKeys: []
    #  - MASTER_DB_PASSWORD
    #  - DB_PASSWORD
    #  - ELASTIC_PASSWORD
    #  - AES_SECRET
    #  - JWT_SECRET
    # The chart defaults MASTER_DB_PASSWORD: DB_PASSWORD, so the vault needs
    # DB_PASSWORD. `aliases: {}` does NOT clear it (Helm merges maps); use
    # `aliases: null` if you store both keys explicitly.
    #
    # Deployments rolled when the payload changes. These names MUST match your
    # release names, or the sync succeeds while pods keep stale credentials.
    # Set restartTargets explicitly if your releases are not named
    # `nected` / `nected-temporal`.
    nectedReleaseName: nected
    temporalFullname: nected-temporal
    # restartTargets: [nected-nalanda, nected-vidhaan-router, nected-temporal-frontend]

  aws:
    region: ""                     # required when provider is aws
  azure:
    vaultUrl: ""                   # https://<vault>.vault.azure.net

  serviceAccount:
    roleArn: ""                    # EKS IRSA
    clientId: ""                   # Azure Workload Identity

# konark chart values to be updated
konark:
  enabled: true
  replicaCount: 1
  envVars:
    VITE_API_HOST: <<scheme>>://<<backend-domain>>
    VITE_GRAPHQL_URL: <<scheme>>://<<backend-domain>>/graphql/query
    VITE_NGINX_SERVER_NAME: <<ui-domain>>

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"

# nalanda chart values to be updated
nalanda:
  enabled: true
  replicaCount: 1
  existingSecret: *credentialSecret
  secretKeys: *credentialSecretKeys
  envVars:
    # VIDHAAN_PRE_SHARED_KEY: <<LICENSE_KEY>>
    ALLOWED_CORS_ORIGIN: <<scheme>>://<<backend-domain>>,<<scheme>>://<<ui-domain>>
    ALLOWED_HOSTS: <<backend-domain>>
    BACKEND_URL: <<scheme>>://<<backend-domain>>

    # Database Config
    MASTER_DB_NAME: *pgDatabase
    MASTER_DB_USER: *pgUser
    MASTER_DB_PASSWORD: *pgPassword
    MASTER_DB_HOST: *pgHost
    MASTER_DB_PORT: *pgPort
    MASTER_SSL_MODE: *pgSslMode

    # Redis Config
    REDIS_TLS_ENABLED: *redisTlsEnabled
    REDIS_INSECURE_TLS: *redisInsecureTls
    REDIS_HOST: *redisHost
    REDIS_PORT: *redisPort
    REDIS_DATABASE: "0"
    REDIS_USERNAME: *redisUser
    REDIS_PASSWORD: *redisPassword

    VIDHAAN_REDIS_TLS_ENABLED: *redisTlsEnabled
    VIDHAAN_REDIS_INSECURE_TLS: *redisInsecureTls
    VIDHAAN_REDIS_HOST: *redisHost
    VIDHAAN_REDIS_PORT: *redisPort
    VIDHAAN_REDIS_DATABASE: "1"
    VIDHAAN_REDIS_USERNAME: *redisUser
    VIDHAAN_REDIS_PASSWORD: *redisPassword

    # ElasticSearch Config
    ELASTIC_PROVIDER: *elasticProvider
    ELASTIC_ENABLED: *elasticEnabled
    ELASTIC_HOSTS: *elasticHost
    ELASTIC_API_KEY: *elasticAPiKey
    ELASTIC_INSECURE_TLS: *elasticInsecureTls
    ELASTIC_USER: *elasticUser
    ELASTIC_PASSWORD: *elasticPassword

     # Email Config
    SEND_EMAIL: "false"
    # ses / smtp
    EMAIL_PROVIDER: smtp
    # Email provider: ses
    AWS_ACCESS_KEY: ""
    AWS_SECRET_KEY: ""
    AWS_REGION: ""
    #Email Provider smtp
    SENDER_EMAIL: ""
    SENDER_NAME: ""
    EMAIL_INSECURE_TLS: ""
    EMAIL_HOST: ""
    EMAIL_PORT: ""
    EMAIL_USERNAME: ""
    EMAIL_PASSWORD: ""

    # Konark Urls
    ASSETS_BASE_URL: <<scheme>>://<<ui-domain>>/assets/konark
    KONARK_BASE_URL: <<scheme>>://<<ui-domain>>

    # comma separated email domains to allow signup from
    SIGNUP_DOMAINS: ""

    # default user created on setup
    NECTED_USER_EMAIL: *uiUserName
    NECTED_USER_PASSWORD: *uiUserPassword

    # default vidhaan settings
    DEFAULT_VIDHAAN_SCHEME: <<scheme>>
    DEFAULT_VIDHAAN_DOMAIN: <<router-domain>>
    # k8s cluster gw ip
    DEFAULT_VIDHAAN_WHITELISTED_IPS: ""

    OTEL_ENABLED: *otlpEnabled
    OTEL_EXPORTER_OTLP_PROTOCOL: *otlpProtocol
    OTEL_EXPORTER_OTLP_ENDPOINT_TRACE: *otlpEndpointTrace
    OTEL_EXPORTER_OTLP_ENDPOINT_METRIC: *otlpEndpointMetric
    OTEL_EXPORTER_OTLP_HEADERS: *otlpHeaders
    OTEL_TRACES_SAMPLER_RATIO: *otlpSamplerRatio
    OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: *otlpTemporality

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 85
    targetMemoryUtilizationPercentage: 85

