###
nameOverride: "nected-temporal"
fullnameOverride: "nected-temporal"

NECTED_PG_HOST: &pgHost datastore-postgresql
NECTED_PG_USER: &pgUser nected
NECTED_PG_PASSWORD: &pgPassword psqlPass123
NECTED_PG_PORT: &pgPort 5432
NECTED_PG_TLS_ENABLED: &pgTlsEnabled false
NECTED_PG_HOST_VERIFICATIO: &pgHostVerification false

server:
  enabled: true
  dynamicConfig:
    matching.numTaskqueueReadPartitions:
    - value: 5
      constraints: {}
    matching.numTaskqueueWritePartitions:
    - value: 5
      constraints: {}
  config:
    logLevel: "debug,info"
    # IMPORTANT: This value cannot be changed, once it's set.
    numHistoryShards: 256
    dcRedirectionPolicy:
      policy: "selected-apis-forwarding"
      toDC: ""

    clusterMetadata:
      enableGlobalNamespace: true
      replicationConsumer:
        type: rpc
      failoverVersionIncrement: 100
      masterClusterName: "nected-op"
      currentClusterName: "nected-op" # <current cluster name>
      clusterInformation:
        nected-op:
          enabled: true
          initialFailoverVersion: 1
          rpcName: "frontend"
          rpcAddress: "0.0.0.0:7233"
    persistence:
      defaultStore: default
      default:
        driver: "sql"
        sql:
          driver: "postgres12"
          database: temporal
          maxConns: 20
          maxIdleConns: 10
          maxConnLifetime: "1h"
          # if external use external host address & credentials
          host: *pgHost
          port: *pgPort
          user: *pgUser
          # Inline password. Prefer existingSecret below: it suppresses the
          # chart-rendered Secret entirely.
          password: *pgPassword
          # existingSecret: nected-credential
          # secretKey: MASTER_DB_PASSWORD
          tls:
           enabled: *pgTlsEnabled
           enableHostVerification: *pgHostVerification
      visibility:
        driver: "sql"
        sql:
          driver: "postgres12"
          database: temporal_visibility
          maxConns: 20
          maxIdleConns: 10
          maxConnLifetime: "1h"
          # if external use external host address & credentials
          host: *pgHost
          port: *pgPort
          user: *pgUser
          password: *pgPassword
          # existingSecret: nected-credential
          # secretKey: MASTER_DB_PASSWORD
          tls:
            enabled: *pgTlsEnabled
            enableHostVerification: *pgHostVerification
  frontend:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: "2"
      maxReplicas: "4"
      targetCPU: "85"
      targetMemory: "85"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
  history:
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 1024Mi
  matching:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: "2"
      maxReplicas: "4"
      targetCPU: "85"
      targetMemory: "85"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
  worker:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: "1"
      maxReplicas: "2"
      targetCPU: "85"
      targetMemory: "85"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi

admintools:
  enabled: false
web:
  enabled: false

schema:
  createDatabase:
    enabled: true
  setup:
    enabled: true
  update:
    enabled: true

elasticsearch:
  external: false
  enabled: false
  # IMPORTANT: setting external: true (or enabled: true) forces the visibility
  # store onto the elasticsearch driver, regardless of
  # server.config.persistence.visibility.driver. With external OpenSearch the
  # visibility password therefore comes from HERE, not from the sql block above.
  # host: search.example.com
  # scheme: https
  # port: 443
  # version: v7
  # username: nected
  # password: esPass123
  # existingSecret: nected-credential
  # secretKey: ELASTIC_PASSWORD

# secretsmanager subchart. Temporal has no encryption-at-rest key, so
# commonSecret stays off and nothing renders until credentials are enabled.
#
# The nected chart carries the same subchart. Hooks only order within a
# release, so install order is not guaranteed; whichever release runs first
# writes the Secret and the other sees an unchanged hash and does nothing.
# credentials.enabled must therefore be true in BOTH values files, or the
# temporal pods fail with `secret not found` when temporal installs first.
secretsmanager:
  provider: ""                     # "" = nothing renders | aws | azure

  commonSecret:
    enabled: false                 # nected owns this key

  credentials:
    enabled: false                 # requires a provider
    secret: nected-credential      # what existingSecret above points at
    remoteKeys: []                 # aws: nected/prod/app | azure: nected-prod-app
    requiredKeys: []
    #  - MASTER_DB_PASSWORD
    #  - ELASTIC_PASSWORD          # when using the elasticsearch block above
    # Names of the Deployments to roll when the payload changes. Must match
    # your release names or pods keep stale credentials silently.
    nectedReleaseName: nected
    temporalFullname: nected-temporal
    # restartTargets: [nected-nalanda, nected-temporal-frontend]

  aws:
    region: ""
  azure:
    vaultUrl: ""

  serviceAccount:
    roleArn: ""                    # EKS IRSA
    clientId: ""                   # Azure Workload Identity

prometheus:
  enabled: false
grafana:
  enabled: false
cassandra:
  enabled: false
mysql:
  enabled: false
